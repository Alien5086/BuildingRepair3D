<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建築設備維護系統 - V13.90</title>
  <link rel="stylesheet" href="style.css?v=1390">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <!-- Post-processing -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/OutlinePass.js"></script>
</head>
<body style="margin:0; padding:0; overflow:hidden; background:#0f172a; font-family:'Noto Sans TC', sans-serif;">
  <div id="app">
    <div id="scene-container"></div>
    
    <div id="ui-overlay">
      <header class="app-header">
        <div class="logo-group" onclick="handleAdminEasterEgg()" style="cursor: pointer; user-select: none;" title="連按 5 下開啟隱藏選項">
          <span class="icon">🛠️</span>
          <h1>智慧設施維護系統</h1>
        </div>
        <div class="nav-links">
          <button id="admin-gui-btn" class="nav-btn" onclick="toggleGUI()" style="display:none;">🔧 參數調校</button>
          <button class="toggle-btn" onclick="toggleView()">
            <span class="btn-icon">🗺️</span> 切換平面圖
          </button>
        </div>
      </header>

      <div id="page-2d" class="page-2d-overlay" style="display:none;">
        <!-- 新增：各樓層切換導航列 (隱藏式, 毛玻璃) -->
        <div id="floor-tabs-wrapper" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:10001; display:flex; flex-direction:column; align-items:center;">
          <button id="floor-tabs-toggle" onclick="const t=document.getElementById('floor-tabs'); t.style.display = t.style.display === 'none' ? 'flex' : 'none';" style="background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); color:white; padding:8px 24px; border-radius:20px; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:0 8px 32px rgba(0,0,0,0.3); display:flex; align-items:center; gap:8px; transition:0.2s;">
            🏢 樓層切換
          </button>
          <div id="floor-tabs" style="display:none; gap:10px; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); padding:12px 18px; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,0.3); flex-wrap:wrap; justify-content:center; width:max-content; max-width:90vw; margin-top:10px;">
            <!-- Tabs will be generated dynamically -->
          </div>
        </div>

        <div class="plan-wrapper-2d">
          <div class="plan-container-2d">
            <img id="plan-img-2d" src="" alt="Floor Plan">
            <svg id="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:9999;">
              <!-- 路徑會動態生成 -->
            </svg>
            <div id="plan-markers-2d" class="markers-layer"></div>
          </div>
          <button class="exit-btn-green" onclick="exitFloorView(); event.stopPropagation();">← 返回</button>
        </div>
      </div>

      <div class="bottom-hint">
        <span class="mouse-icon">🖱️</span> 滑鼠左鍵拖動 · 滾輪縮放 · 點擊建築層進入維修模式
      </div>

      <div id="ts-overlay" class="ts-overlay"></div>

      <div id="ts-nav-bar" onmousedown="startDragNav(event)" style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(15, 23, 42, 0.65); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); padding:10px 25px; border-radius:50px; border:1px solid rgba(251, 191, 36, 0.5); z-index:10000; color:white; align-items:center; gap:20px; box-shadow:0 8px 32px rgba(0,0,0,0.4); cursor:move;">
        <div class="logo-group" style="font-size:1.3rem; pointer-events:none;">🛠️</div>
        <div id="ts-nav-text" style="font-size:1rem; font-weight:500; min-width:250px; pointer-events:none;"></div>
        <div style="display:flex; gap:10px;">
          <button class="ts-btn prev" onclick="window.prevTS()" style="padding:6px 15px; border-radius:20px; font-size:0.9rem; cursor:pointer;">上一步</button>
          <button class="ts-btn next" onclick="window.nextTS()" style="padding:6px 20px; border-radius:20px; background:#10b981; font-size:0.9rem; cursor:pointer;">下一步</button>
        </div>
      </div>

      <div id="ts-panel" class="troubleshoot-panel">
        <div class="ts-header">
          <h3 id="ts-title">設備維護導覽</h3>
          <div style="display:flex; align-items:center; gap:15px;">
            <span style="font-size: 0.8rem; color: #94a3b8;">步驟 <span id="ts-step-num">1</span></span>
            <button class="ts-close-btn" onclick="exitTS()">✕</button>
          </div>
        </div>
        <div id="ts-media" class="ts-media"></div>
        <div id="ts-content" class="ts-content">載入中...</div>
        <div class="ts-footer">
          <button id="ts-btn-prev" class="ts-btn prev" onclick="prevTS()">上一步</button>
          <button id="ts-btn-next" class="ts-btn next" onclick="nextTS()">下一步</button>
        </div>
      </div>
    </div>

    <div id="basement-full-2d">
      <div class="full-img-container" onclick="event.stopPropagation()">
        <img src="assets/plan07.png" alt="B1 Full Plan">
        <div id="basement-markers" class="marker-layer"></div>
        <div class="close-tip" onclick="closeBasementFull()">點擊標記或點此關閉</div>
      </div>
    </div>

    <div id="building-label"></div>
    <div id="loading-overlay">
      <div class="loader-box">
        <div class="loader-text">系統加載中... <span id="progress-text">0%</span></div>
        <div class="loader-bar"><div id="progress-fill"></div></div>
      </div>
    </div>

    <!-- 📖 操作指引彈窗 -->
    <div id="guide-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-icon">🏫</span>
          <h2>歡迎使用維護系統</h2>
          <p class="modal-subtitle">請在地圖上選擇您目前所在的建築物<br>以定位故障的樓層與教室</p>
        </div>
        <div class="modal-body">
          <div class="guide-item">
            <span class="key">🖱️ 旋轉/縮放</span>
            <span class="desc">尋找您所在的建築物</span>
          </div>
          <div class="guide-item">
            <span class="key">🏢 點擊建築</span>
            <span class="desc">展開樓層視圖</span>
          </div>
          <div class="guide-item">
            <span class="key">📍 選擇房間</span>
            <span class="desc">點擊標記進入維護指引</span>
          </div>
        </div>
        <button class="start-btn" onclick="closeGuide()">開始定位</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script src="app.js?v=1391"></script>
  <script src="scene3d_v2.js?v=1391"></script>
</body>
</html>
